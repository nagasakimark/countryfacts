<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>せかいたんけん</title>
<link rel="icon" href="favicon.svg">
<style>
:root{--ink:#3b2a5c;--paper:#fff3d6;--sun:#ffc531;--pink:#ff6f91;--mint:#33c9a0;--red:#ff5a4d;
--font:"RocknRoll One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050b25;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1366px;height:598px;position:relative;transform-origin:center;overflow:hidden;background:#050b25}
canvas{position:absolute;left:0;top:0;width:1366px;height:598px}
ruby rt{font-size:.5em;font-weight:normal}
.setsu{font-style:normal;font-size:.7em;background:#ffd9a0;border:2px solid var(--ink);border-radius:8px;padding:0 4px;margin-left:4px;white-space:nowrap}
#hud{position:absolute;left:12px;top:10px;display:flex;gap:10px;align-items:center;z-index:5}
.pill{background:var(--paper);border:4px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:20px;box-shadow:0 4px 0 var(--ink);display:flex;gap:8px;align-items:center;height:46px;white-space:nowrap}
.pill b{font-size:22px}
.title{background:var(--sun);transform:rotate(-2deg);font-size:23px}
#sbox{position:relative}
#q{border:0;outline:0;background:transparent;font:inherit;font-size:19px;width:220px;color:var(--ink);user-select:text}
#q::placeholder{color:#9a8bb8}
#sug{position:absolute;left:0;top:54px;width:330px;background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);overflow:hidden;display:none}
.sg{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:18px;cursor:pointer;border-bottom:2px dashed #e0cf9f}
.sg:last-child{border-bottom:0}.sg.on,.sg:hover{background:#ffe08a}
.sg img{width:32px;height:24px;border:2px solid var(--ink);object-fit:cover}
.sg small{margin-left:auto;font-size:13px;opacity:.65}
#zoom{position:absolute;left:14px;top:76px;display:flex;flex-direction:column;gap:10px;z-index:5}
.zb{width:48px;height:48px;border-radius:16px;border:4px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);font-size:28px;line-height:1;cursor:pointer;color:var(--ink);font-family:inherit;display:grid;place-items:center;padding:0}
.zb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#dock{position:absolute;left:470px;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.toy{width:66px;height:66px;border-radius:22px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .12s}
.toy:hover{transform:translateY(-6px) rotate(-4deg)}
.toy:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.toy svg{width:36px;height:36px;margin-top:-6px}
.toy span{position:absolute;bottom:2px;font-size:11px;white-space:nowrap;color:var(--ink);background:#fff;border-radius:8px;padding:0 5px;border:2px solid var(--ink)}
#tip{position:absolute;left:0;top:0;z-index:7;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 12px;font-size:17px;opacity:0;pointer-events:none;white-space:nowrap;transform:translate(-50%,-130%)}
#toast{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:8;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:6px 16px;font-size:17px;box-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s;pointer-events:none;max-width:700px;text-align:center}
#board{position:absolute;right:14px;top:10px;width:530px;height:578px;z-index:4;transform:translateX(640px) rotate(6deg);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#board.on{transform:translateX(0) rotate(.6deg)}
.card{position:absolute;inset:0;background:var(--paper);border:5px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 rgba(15,20,60,.55);background-image:radial-gradient(#f2dfae 1.2px,transparent 1.4px);background-size:14px 14px;overflow:hidden}
#page{position:absolute;left:0;right:0;top:0;bottom:64px;padding:12px 16px 0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#page::-webkit-scrollbar{width:8px}#page::-webkit-scrollbar-thumb{background:#c9b27a;border-radius:8px}
#tabs{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;gap:6px;padding:6px 10px;background:#f4e2b0;border-top:4px solid var(--ink);align-items:center}
.tb{flex:1;height:44px;border:3px solid var(--ink);border-radius:14px;color:#fff;font-family:inherit;font-size:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);padding:0;line-height:1.1}
.tb.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);outline:3px solid #fff;outline-offset:-6px}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tape{position:absolute;width:86px;height:26px;background:rgba(255,197,49,.75);border:2px dashed rgba(59,42,92,.35);z-index:3}
.head{display:flex;align-items:center;gap:12px;margin-top:4px}
.fl{width:84px;height:63px;border:4px solid var(--ink);box-shadow:0 4px 0 rgba(59,42,92,.35);transform:rotate(-4deg);flex:none;background:#fff;object-fit:cover}
.stampcode{position:absolute;right:136px;top:6px;width:54px;height:54px;border-radius:50%;border:4px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:18px;transform:rotate(-12deg);background:rgba(255,255,255,.85);z-index:2}
.stampcode.pop{animation:pop .7s cubic-bezier(.2,2.2,.4,1)}
@keyframes pop{0%{transform:scale(3) rotate(40deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.head h1{margin:0;font-size:34px;line-height:1.05}
.head small{display:block;font-size:14px;opacity:.7}
.say{margin-left:auto;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:6px 12px;font-size:19px;cursor:pointer;line-height:1.1;text-align:center}
.say:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.say small{color:#fff;opacity:.9}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 8px;font-size:13px;line-height:1.25;text-align:center}
.chip b{display:block;font-size:17px}
.row{display:flex;gap:12px;margin-top:10px;justify-content:center}
.pol{width:148px;background:#fff;border:3px solid var(--ink);padding:6px 6px 8px;box-shadow:0 6px 0 rgba(59,42,92,.3);cursor:pointer;transition:transform .2s}
.pol:nth-child(1){transform:rotate(-4deg)}.pol:nth-child(2){transform:rotate(3deg) translateY(6px)}.pol:nth-child(3){transform:rotate(-2deg)}
.pol:hover{transform:rotate(0) scale(1.08) translateY(-6px);z-index:5}
.pol img{width:100%;height:98px;object-fit:cover;display:block;border:2px solid var(--ink)}
.pol div{font-size:13px;text-align:center;margin-top:5px;line-height:1.2;min-height:30px}
.pol i{display:block;font-style:normal;font-size:11px;opacity:.6}
.notes{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.note{background:#fff9a8;border:3px solid var(--ink);padding:6px 10px 6px 36px;font-size:15px;line-height:1.35;position:relative;border-radius:6px 16px 6px 6px;box-shadow:0 4px 0 rgba(59,42,92,.25)}
.note:nth-child(2n){transform:rotate(-.8deg);background:#c7f3df}
.note:before{content:"?!";position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.holes{margin:14px 0 10px}
.holes h3{margin:0 0 4px;font-size:15px;opacity:.75}
.holes>div{display:flex;gap:10px}
.hole{flex:1;border:4px solid var(--ink);border-radius:18px;padding:6px 30px 7px 9px;color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-size:16px;line-height:1.15;position:relative;overflow:hidden;text-align:left;min-height:56px}
.hole small{display:block;font-size:11px;opacity:.9;white-space:nowrap}
.hole:hover{transform:translateY(-4px)}.hole:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hole:after{content:"";position:absolute;right:-12px;top:-12px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.25);box-shadow:0 0 0 8px rgba(0,0,0,.12)}
#x{position:absolute;right:-6px;top:-8px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;border:4px solid var(--ink);z-index:6;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink)}
/* inner pages */
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.ph .fl{width:56px;height:42px;border-width:3px}
.ph h2{margin:0;font-size:24px}.ph small{opacity:.7;font-size:13px;display:block}
.lab{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px;font-size:14px;margin:8px 0 5px;transform:rotate(-1.5deg)}
.box{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.45;box-shadow:0 4px 0 rgba(59,42,92,.25);margin-bottom:8px}
.tl{position:relative;margin-left:8px;padding-left:18px;border-left:5px dotted #c9a24a}
.ev{position:relative;margin:0 0 12px}
.ev:before{content:"";position:absolute;left:-30px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--red);border:4px solid var(--ink)}
.yr{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:10px;padding:0 8px;font-size:14px;transform:rotate(-2deg);margin-bottom:3px}
.ev p{margin:0;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.4;box-shadow:0 4px 0 rgba(59,42,92,.2)}
.jpt{background:#ffe1e6;border:3px dashed var(--red);border-radius:14px;padding:8px 12px;font-size:15px;margin-top:6px}
.sayrow{display:flex;gap:10px}
.sayb{flex:1;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px;font-size:18px;text-align:center;cursor:pointer;line-height:1.15}
.sayb small{display:block;font-size:12px;opacity:.9}
.sayb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bar{margin:6px 0 10px}.bar .t{font-size:14px;display:flex;justify-content:space-between}
.bar .tr{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;margin-top:2px;position:relative;overflow:hidden}
.bar .f{position:absolute;left:0;top:0;bottom:0}
.big{font-size:19px;line-height:1.4;margin:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;font-size:13px;line-height:1.3}
.tile b{display:block;font-size:19px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 12px;font:inherit;font-size:17px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt.right{background:#b9f0cf}.opt.wrong{background:#ffc1c1}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn{display:inline-block;background:var(--mint);color:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:5px 14px;font:inherit;font-size:16px;cursor:pointer;text-decoration:none;margin-top:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ctr{text-align:center}.mut{font-size:13px;opacity:.7}
#conf{pointer-events:none;z-index:9}
</style></head><body>
<div id="wrap"><div id="stage">
 <canvas id="cv"></canvas>
 <div id="hud"><div class="pill title">せかいたんけん</div>
  <div id="sbox"><div class="pill"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#3b2a5c" stroke-width="3.5"/><path d="M15 15l7 7" stroke="#3b2a5c" stroke-width="4" stroke-linecap="round"/></svg><input id="q" placeholder="国を さがす" autocomplete="off"></div><div id="sug"></div></div>
  <div class="pill">スタンプ <b id="cnt">0</b> / <span id="tot">36</span></div></div>
 <div id="zoom"><button class="zb" id="zi">＋</button><button class="zb" id="zo">－</button><button class="zb" id="zh" title="ぜんたい"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#3b2a5c" stroke-width="3"/><path d="M3 12h18M12 3c4 4 4 14 0 18M12 3c-4 4-4 14 0 18" fill="none" stroke="#3b2a5c" stroke-width="2"/></svg></button></div>
 <div id="tip"></div><div id="toast"></div>
 <div id="dock"></div>

 <canvas id="conf" width="1366" height="598"></canvas>
</div></div>
<script src="vendor/d3.min.js"></script><script src="vendor/topojson-client.min.js"></script>
<script src="data/world.js"></script><script src="data/countries.js"></script><script src="data/fun.js"></script><script src="data/media.js"></script><script src="data/atlas.js"></script>
<script src="js/util.js"></script>
<script>
(function(){
var W=1366,H=598,$=function(s){return document.querySelector(s)},esc=App.esc;
var cv=$('#cv'),ctx=cv.getContext('2d'),dirty=true,Q=1;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform='scale('+s+')';var q=Math.min(2,Math.max(1,s*(window.devicePixelRatio||1)));if(Math.round(W*q)!==cv.width){Q=q;cv.width=Math.round(W*Q);cv.height=Math.round(H*Q)}dirty=true}
addEventListener('resize',fit);
/* ---------- data ---------- */
var byId=App.byId;
var INFO=function(id){return id==='JPN'?window.JAPAN_FUN:window.FUN[id]};
var featured=App.featured.concat([byId.JPN]);
$('#tot').textContent=featured.length;
var feat=App.features.filter(function(f){return f.properties.id!=='ATA'&&byId[f.properties.id]});
var COL={'アジア':'#ffd54a','ヨーロッパ':'#7db7ff','アフリカ':'#ff9a62','北アメリカ':'#5fd08f','南アメリカ':'#c39bff','オセアニア':'#4fd9cc'};
function mix(a,b,t){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),r=function(s){return Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t)};return 'rgb('+r(16)+','+r(8)+','+r(0)+')'}
function stamps(){return Object.keys(App.save.stamps||{}).length}
function upd(){$('#cnt').textContent=stamps()}upd();
/* ruby + badge markup: {漢字|かんじ} and (せつ) */
function rb(s){return esc(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\(せつ\)/g,'<i class="setsu">いわれている</i>')}
/* ---------- geometry caches ---------- */
var CEN={},RAD={},AW={},FILL={},PRI=[];
feat.forEach(function(f){var id=f.properties.id,c=byId[id],g=f.geometry,big=f;
 if(g.type==='MultiPolygon'){var ba=0;g.coordinates.forEach(function(co){var pf={type:'Feature',geometry:{type:'Polygon',coordinates:co}},a=d3.geoArea(pf);if(a>ba){ba=a;big=pf}})}
 var ctr=d3.geoCentroid(big);CEN[id]=ctr;var b=d3.geoBounds(f),r=0,whole=d3.geoBounds(f);
 [[b[0][0],b[0][1]],[b[1][0],b[1][1]],[b[0][0],b[1][1]],[b[1][0],b[0][1]]].forEach(function(p){r=Math.max(r,d3.geoDistance(ctr,p))});
 if(b[0][0]>b[1][0])r=Math.max(r,Math.PI/2); /* crosses the date line: be generous */
 RAD[id]=Math.min(Math.PI,r);AW[id]=Math.sqrt(d3.geoArea(big));
 var base=COL[c.region]||'#d9d2ef';FILL[id]=(INFO(id))?base:mix(base,'#ece8f6',.5);PRI.push({id:id,a:AW[id]})});
PRI.sort(function(a,b){return b.a-a.a});
/* coarse copies for fast drawing while the globe is moving */
function thin(ring,e){var out=[ring[0]],l=ring[0];for(var i=1;i<ring.length-1;i++){var p=ring[i];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])>e){out.push(p);l=p}}out.push(ring[ring.length-1]);return out}
var LO={};feat.forEach(function(f){var g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates,keep=[];
 polys.forEach(function(po){var o=thin(po[0],1.8);if(o.length>=4)keep.push([o])});
 if(!keep.length){keep=[[thin(polys[0][0],.2)]]}
 LO[f.properties.id]={type:'Feature',geometry:{type:'MultiPolygon',coordinates:keep}}});
var MESH=topojson.mesh(WORLD_TOPO,WORLD_TOPO.objects.countries,function(a,b){return a!==b});
/* ---------- view ---------- */
var rot=[-138,-30],S=430,cx=683,cy=299,sel=null,hover=null,moving=false,mvT;
var proj=d3.geoOrthographic().clipAngle(90).precision(.6),gp=d3.geoPath(proj,ctx);
var SMIN=235,SMAX=30000;
function viewCenter(){return [-rot[0],-rot[1]]}
function clampV(){S=Math.max(SMIN,Math.min(SMAX,S));rot[1]=Math.max(-85,Math.min(85,rot[1]));rot[0]=((rot[0]+540)%360)-180}
function bump(){moving=true;dirty=true;clearTimeout(mvT);mvT=setTimeout(function(){moving=false;dirty=true},140)}
var anim=null;
function tween(to,ms){var f={r:rot.slice(),s:S,cx:cx},s0=performance.now();var dl=to.r[0]-f.r[0];dl=((dl+540)%360)-180;
 anim={tick:function(n){var e=Math.min(1,(n-s0)/ms),k=1-Math.pow(1-e,3);rot=[f.r[0]+dl*k,f.r[1]+(to.r[1]-f.r[1])*k];S=f.s*Math.pow(to.s/f.s,k);cx=f.cx+((to.cx==null?f.cx:to.cx)-f.cx)*k;clampV();bump();return e>=1}}}
function flyTo(id){var c=CEN[id],r=Math.max(.02,Math.min(1.1,RAD[id]));var s=Math.max(300,Math.min(24000,235/Math.sin(Math.min(1.2,r))));tween({r:[-c[0],Math.max(-70,Math.min(70,-c[1]))],s:s,cx:405},900)}
function home(){tween({r:[-138,-30],s:430,cx:sel?405:683},700)}
function zoomBy(f,px,py){var ll=proj.invert([px,py]);S=Math.max(SMIN,Math.min(SMAX,S*f));setProj();if(ll){for(var i=0;i<4;i++){var q=proj(ll);if(!q)break;rot[0]+=(px-q[0])/S*57.2958/Math.max(.2,Math.cos(rot[1]*Math.PI/180));rot[1]-=(py-q[1])/S*57.2958;clampV();setProj()}}bump()}

 $('#tabs').innerHTML=ps.map(function(p){return '<button class="tb'+(p[0]===curPage?' on':'')+'" data-p="'+p[0]+'" style="background:'+p[2]+'">'+p[1]+'</button>'}).join('');
 Array.prototype.forEach.call($('#tabs').children,function(b){b.onclick=function(){beep();curPage=b.dataset.p;renderBoard()}});
 var pg=$('#page');pg.scrollTop=0;pg.innerHTML=PG[curPage](c);bindPage(pg,c)}
function head(c,f){return '<div class="head">'+(c.a2?'<img class="fl" src="flags/'+c.a2.toLowerCase()+'.svg" alt="">':'')+'<div><h1>'+c.ja+'</h1><small>'+c.en+'</small></div>'+(f&&f.hello?'<div class="say" data-say="hello">'+esc(f.hello.text)+'<small>きいてみよう ▶</small></div>':'')+'</div>'}
function mini(c){return '<div class="ph">'+(c.a2?'<img class="fl" src="flags/'+c.a2.toLowerCase()+'.svg" alt="">':'')+'<div><h2>'+c.ja+'</h2><small>'+c.en+'</small></div></div>'}
function chips(c){return '<div class="chips"><div class="chip">首都<b>'+esc(c.capJa||'—')+'</b></div><div class="chip">人口<b>'+App.fmtPeople(c.pop).replace('約','')+'</b></div><div class="chip">面積<b>'+App.fmtArea(c.area).replace('約','')+'</b></div></div>'}
var PG={};
PG.p1=function(c){var f=INFO(c.id),a=window.ATLAS[c.id];
 if(!f)return '<div class="tape" style="left:40px;top:-8px;transform:rotate(-6deg)"></div>'+head(c)+chips(c)+'<div class="notes" style="margin-top:26px"><div class="note">この 国の くわしい ページは これから！ 「くらべる」で 日本と くらべよう。 ★の 国を さがして みよう。</div></div>';
 var first=!App.save.stamps[c.id];
 var im=function(k){var u=MEDIA.img[c.id+'_'+k];return u?u:''};
 return '<div class="tape" style="left:40px;top:-8px;transform:rotate(-6deg)"></div><div class="tape" style="right:50px;top:-8px;transform:rotate(5deg)"></div>'+head(c,f)+chips(c)+
 '<div class="row">'+['dish:たべもの','animal:どうぶつ','sport:スポーツ'].map(function(k){var kk=k.split(':');var nm=kk[0]==='sport'?f.sport.replace(/[^　-鿿゠-ヿー・ ]/g,'').trim():(f[kk[0]]||{}).name;return '<div class="pol" data-n="'+esc(nm)+'"><img src="'+im(kk[0])+'" alt=""><div><i>'+kk[1]+'</i>'+esc(nm.replace(/（.*）/,''))+'</div></div>'}).join('')+'</div>'+
 '<div class="notes">'+f.facts.slice(0,2).map(function(x){return '<div class="note">'+esc(x)+'</div>'}).join('')+'</div>'+tunnels(c)};
function tunnels(c){var near=featured.filter(function(x){return x.id!==c.id&&x.region===c.region});if(near.length<1)near=featured.filter(function(x){return x.id!==c.id});
 var l1=near[Math.floor(Math.random()*near.length)],far=featured.filter(function(x){return x.region!==c.region}),l2=far[Math.floor(Math.random()*far.length)];
 var rest=featured.filter(function(x){return x.id!==c.id&&x.id!==l1.id&&x.id!==l2.id}),l3=rest[Math.floor(Math.random()*rest.length)];
 return '<div class="holes"><h3>▼ あなに 入って 次の 国へ</h3><div>'+[[l1,'ちかくの 国'],[l2,'ぐうぜん！'],[l3,'もっと 知りたい']].map(function(a,i){return '<div class="hole" data-id="'+a[0].id+'" style="background:'+HOLE[i]+'"><small>'+a[1]+'</small>'+a[0].ja+'</div>'}).join('')+'</div></div>'}
PG.p2=function(c){var a=window.ATLAS[c.id];return mini(c)+'<span class="lab">れきし</span><div class="tl">'+a.h.map(function(e){return '<div class="ev"><span class="yr">'+rb(e[0])+'</span><p>'+rb(e[1])+'</p></div>'}).join('')+'</div>'+(a.jp?'<div class="jpt"><b>日本との つながり</b><br>'+rb(a.jp)+'</div>':'')};
PG.p3=function(c){var f=INFO(c.id),a=window.ATLAS[c.id];
 return mini(c)+'<span class="lab">ことば</span><div class="box">'+rb(a.lng)+'<br><span class="mut">話されている 主な ことば：'+esc(f.lang)+'</span></div>'+
 '<div class="sayrow"><div class="sayb" data-say="hello" lang="'+esc(f.voice||'')+'">'+esc(f.hello.text)+'<small>'+esc(f.hello.kana)+'・こんにちは</small></div><div class="sayb" data-say="thanks" lang="'+esc(f.voice||'')+'">'+esc(f.thanks.text)+'<small>'+esc(f.thanks.kana)+'・ありがとう</small></div></div>'+
 '<div class="mut ctr" style="margin-top:4px">'+(f.hello.audio?'ほんものの 人の 声':'パソコンの 読み上げの 声')+'</div>'+
 '<span class="lab">ひとびと</span><div class="box">'+rb(a.ppl)+'</div><span class="lab">しゅうきょう</span><div class="box">'+rb(a.rel)+'</div>'};
PG.p4=function(c){var f=INFO(c.id),a=window.ATLAS[c.id],j=window.JAPAN_FUN,s=f.school,js=j.school,out=mini(c);
 out+='<span class="lab">お金</span><div class="box"><b>'+rb(a.mny.n)+'</b>（日本は 円）<br>'+rb(a.mny.t)+'</div>';
 out+='<span class="lab">ぶんか</span>'+a.cul.map(function(x){return '<div class="box">'+rb(x)+'</div>'}).join('');
 out+='<span class="lab">お祭り・行事</span><div class="box"><b>'+rb(a.fes[0])+'</b><br>'+rb(a.fes[1])+'</div>';
 if(f.flag)out+='<span class="lab">国旗の ひみつ</span><div class="box">'+esc(f.flag)+'</div>';
 if(s){var m='';for(var i=1;i<=12;i++)m+='<span style="display:inline-block;width:8.3%;text-align:center;font-size:12px;border:2px solid var(--ink);border-radius:6px;background:'+(i===s.start?'#ffd54a':(i===4?'#ffd5dc':'#fff'))+'">'+i+'</span>';
  out+='<span class="lab">学校</span><div class="box">学校の 1年が はじまる 月（黄色：'+esc(c.ja)+'、 ピンク：日本）<div style="margin:4px 0">'+m+'</div>'+esc(s.note)+'<br><span class="mut">日本：'+esc(js.note)+'</span></div>'}
 if(f.facts.length>2)out+='<span class="lab">びっくり</span>'+f.facts.slice(2).map(function(x){return '<div class="note" style="margin:6px 0">'+esc(x)+'</div>'}).join('');
 return out};
function barRow(label,v,jv,unit,c,max){if(v==null)return '';var m=max||Math.max(v,jv)*1.15;return '<div class="bar"><div class="t"><span>'+label+'</span><b>'+esc(c.ja)+' '+v+unit+' ／ 日本 '+jv+unit+'</b></div><div class="tr"><div class="f" style="width:'+(v/m*100)+'%;background:#ffd54a"></div></div><div class="tr" style="margin-top:3px"><div class="f" style="width:'+(jv/m*100)+'%;background:#ff6f91"></div></div></div>'}
PG.p5=function(c){var J=App.JP,out=mini(c),off=c.tz?App.offsetFromJapan(c.tz):null;
 var r=c.area/J.area;out+='<div class="big">'+esc(c.ja)+'は 日本の <b>'+App.ratioText(c.area,J.area)+'</b>の 広さ。'+(off==null?'':off===0?' 時間は 日本と おなじ！':' 時差は <b>'+Math.abs(off)+'時間</b>。')+'</div>';
 out+='<div class="tiles"><div class="tile">広さ<b>'+App.fmtArea(c.area)+'</b>'+(App.rankArea.r[c.id]?'世界で '+App.rankArea.r[c.id]+'番目':'')+'</div><div class="tile">人口<b>'+App.fmtPeople(c.pop)+'</b>'+(App.rankPop.r[c.id]?'世界で '+App.rankPop.r[c.id]+'番目':'')+'</div></div>';
 if(c.pop){var dens=Math.round(c.pop/c.area),jd=Math.round(J.pop/J.area);out+='<div class="box" style="margin-top:8px">1 km² に すむ 人：'+esc(c.ja)+' '+dens.toLocaleString()+'人 ／ 日本 '+jd.toLocaleString()+'人'+(dens<jd/3?'（日本より ずっと ゆったり！）':dens>jd*1.5?'（日本より ぎゅうぎゅう！）':'')+'</div>'}
 out+='<span class="lab">くらべてみよう</span>'+barRow('平均じゅみょう',c.life&&App.round1(c.life),App.round1(J.life),'歳',c)+barRow('学校で 学ぶ 年数',c.school&&App.round1(c.school),App.round1(J.school),'年',c)+barRow('しあわせ度（10点まで）',c.happy&&App.round1(c.happy),App.round1(J.happy),'点',c,10)+barRow('マクドナルドの セットの ねだん',c.mac,J.mac,'円',c);
 if(c.tz){var se=App.seasonText(c),km=App.distanceKm(c),p=App.localParts(c.tz);out+='<span class="lab">時間・きょり・きせつ</span><div class="box">いま '+esc(c.ja)+'は <b>'+App.clockText(p.h,p.m)+'</b>。<br>'+esc(App.kidActivity(p,c.id).replace(/^\S+\s/,''))+'</div><div class="box">'+esc(se.text)+'</div><div class="box">東京から 首都 '+esc(App.capitalName(c))+'まで 約 <b>'+km.toLocaleString()+' km</b>。</div>'}
 if(c.links){var L=c.links;function tl(l,v,n){return v==null?'':'<div class="tile">'+l+'<b>'+App.fmtMan(v)+'</b>'+(n||'')+'</div>'}
  out+='<span class="lab">日本との つながり</span><div class="tiles">'+tl(esc(c.ja)+'から 日本へ 来た 人（2024年）',L.in)+tl('日本から '+esc(c.ja)+'へ 行った 人（2024年）',L.out,L.outApprox?'めやす':'')+tl('日本に すんでいる '+esc(c.ja)+'の 人',L.res)+tl(esc(c.ja)+'に すんでいる 日本人',L.abroad)+'</div>'}
 out+='<div class="ctr"><a class="btn" href="classic.html#/size/'+c.id+'">ほんとうの 大きさで かさねる</a></div><div style="height:6px"></div>';return out};
var quiz=null;
PG.p6=function(c){quiz=makeQ(c);var got=App.save.stamps[c.id];return mini(c)+(got?'<div class="box" style="background:#d6f5dd">この 国の スタンプは もう もらったよ（'+got+'）。 もう一度 ちょうせん してもいいよ！</div>':'<div class="box" style="background:#fff6c4">こたえて スタンプを もらおう！</div>')+'<div class="big" id="qq">'+quiz.q+'</div><div id="qo">'+quiz.o.map(function(x,i){return '<button class="opt" data-i="'+i+'">'+esc(x)+'</button>'}).join('')+'</div><div id="qr"></div>'};
function makeQ(c){var f=INFO(c.id),a=window.ATLAS[c.id],others=featured.filter(function(x){return x.id!==c.id}),qs=[];
 function three(correct,get){var w=App.shuffle(others).filter(function(x){return get(x)&&get(x)!==get(c)}).slice(0,2);var arr=App.shuffle([c].concat(w));return {o:arr.map(get),a:arr.indexOf(c)}}
 if(c.capJa)qs.push(function(){var t=three(c,function(x){return x.capJa});return {q:esc(c.ja)+'の 首都は どこ？',o:t.o,a:t.a,why:'首都は '+c.capJa+'。'}});
 qs.push(function(){var t=three(c,function(x){var i=INFO(x.id);return i&&i.hello&&i.hello.text+'（'+i.hello.kana+'）'});return {q:esc(c.ja)+'の「こんにちは」は どれ？',o:t.o,a:t.a,why:esc(c.ja)+'では「'+f.hello.text+'」と 言うよ。'}});
 qs.push(function(){var t=three(c,function(x){var i=INFO(x.id);return i&&i.dish&&i.dish.name});return {q:esc(c.ja)+'の ゆうめいな 食べ物は どれ？',o:t.o,a:t.a,why:f.dish.name+'だよ。'}});
 if(a)qs.push(function(){var t=three(c,function(x){var q=window.ATLAS[x.id];return q&&q.mny.n});return {q:esc(c.ja)+'の お金は どれ？',o:t.o.map(function(s){return s.replace(/\{([^|]+)\|[^}]+\}/g,'$1')}),a:t.a,why:'お金は '+a.mny.n.replace(/\{([^|]+)\|[^}]+\}/g,'$1')+'。'}});
 qs.push(function(){var big=c.area>App.JP.area;return {q:esc(c.ja)+'は 日本より 大きい？ 小さい？',o:['日本より 大きい','日本より 小さい'],a:big?0:1,why:esc(c.ja)+'の 広さは 日本の '+App.ratioText(c.area,App.JP.area)+'。'}});
 return App.pick(qs)()}
function bindPage(pg,c){
 Array.prototype.forEach.call(pg.querySelectorAll('.hole'),function(h){h.onclick=function(){choose(h.dataset.id)}});
 Array.prototype.forEach.call(pg.querySelectorAll('.pol'),function(p){p.onclick=function(){tone(700,.1);say(p.dataset.n.replace(/（.*）/,'')+'！')}});
 Array.prototype.forEach.call(pg.querySelectorAll('[data-say]'),function(b){b.onclick=function(){boing();var f=INFO(c.id);App.playPhrase(f[b.dataset.say],f.voice||'en')}});
 if(curPage==='p1'&&!App.save.stamps[c.id]&&false){}
 if(curPage==='p6'){Array.prototype.forEach.call(pg.querySelectorAll('.opt'),function(b){b.onclick=function(){if(pg.dataset.done===c.id+quiz.q)return;pg.dataset.done=c.id+quiz.q;var ok=+b.dataset.i===quiz.a;var os=pg.querySelectorAll('.opt');os[quiz.a].classList.add('right');if(!ok)b.classList.add('wrong');var r=$('#qr');
  if(ok){App.sfx.good();var fresh=App.addStamp(c.id);r.innerHTML='<div class="box" style="background:#d6f5dd"><b>せいかい！</b> '+quiz.why+'</div>'+(fresh?'':'<button class="btn" id="again">べつの もんだい</button>');if(fresh){upd();dirty=true;setTimeout(function(){stampSnd();confetti();say(c.ja+'の スタンプ ゲット！')},300);r.innerHTML+='<div class="ctr"><button class="btn" id="again">もう 1もん</button></div>'}}
  else{App.sfx.bad();r.innerHTML='<div class="box" style="background:#ffe0e0"><b>ざんねん！</b> '+quiz.why+'</div><button class="btn" id="again">もう一回 ちょうせん</button>'}
  var ag=$('#again');if(ag)ag.onclick=function(){delete pg.dataset.done;renderBoard()}}})}
}
/* ---------- confetti ---------- */
var cf=$('#conf'),cc=cf.getContext('2d'),ps=[];
function confetti(){for(var i=0;i<60;i++)ps.push({x:1000,y:140,vx:(Math.random()-.5)*14,vy:-Math.random()*10-2,c:['#ffc531','#ff6f91','#33c9a0','#fff','#7a4bd8'][i%5],r:Math.random()*6,l:70})}
var cfd=false;(function lp(){if(ps.length||cfd){cc.clearRect(0,0,W,H);cfd=ps.length>0}ps=ps.filter(function(p){return p.l>0});ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.l--;cc.save();cc.translate(p.x,p.y);cc.rotate(p.r+=.2);cc.fillStyle=p.c;cc.fillRect(-5,-3,10,6);cc.restore()});requestAnimationFrame(lp)})();
/* ---------- dock ---------- */
var toys=[['#ffc531','さがす','<circle cx="20" cy="20" r="11" fill="#fff" stroke="#3b2a5c" stroke-width="4"/><path d="M29 29l10 10" stroke="#3b2a5c" stroke-width="6" stroke-linecap="round"/>',function(){sq.focus()}],
 ['#ff6f91','さいず','<path d="M6 30h12V16H6zM22 30h14V8H22z" fill="#fff" stroke="#3b2a5c" stroke-width="4" stroke-linejoin="round"/>',function(){location.href='classic.html#/size'+(cur?'/'+cur.id:'')}],
 ['#33c9a0','ゲーム','<rect x="4" y="12" width="32" height="18" rx="9" fill="#fff" stroke="#3b2a5c" stroke-width="4"/><path d="M13 16v10M8 21h10" stroke="#3b2a5c" stroke-width="3"/><circle cx="26" cy="20" r="2.5" fill="#3b2a5c"/><circle cx="31" cy="24" r="2.5" fill="#3b2a5c"/>',function(){location.href='classic.html#/games'}],
 ['#7a4bd8','クイズ','<path d="M12 14a8 8 0 1 1 12 7c-3 2-4 3-4 6" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="36" r="3.5" fill="#fff"/>',function(){if(cur&&INFO(cur.id)){curPage='p6';renderBoard()}else say('★の 国を えらぶと クイズが できるよ！')}],
 ['#ff7a2f','ランダム','<rect x="6" y="6" width="28" height="28" rx="7" fill="#fff" stroke="#3b2a5c" stroke-width="4"/><circle cx="14" cy="14" r="3" fill="#3b2a5c"/><circle cx="20" cy="20" r="3" fill="#3b2a5c"/><circle cx="26" cy="26" r="3" fill="#3b2a5c"/>',function(){choose(featured[Math.floor(Math.random()*featured.length)].id)}],
 ['#4fb3ff','ずかん','<rect x="8" y="4" width="24" height="32" rx="4" fill="#fff" stroke="#3b2a5c" stroke-width="4"/><circle cx="20" cy="18" r="6" fill="none" stroke="#ff5a4d" stroke-width="3"/>',function(){location.href='classic.html#/passport'}]];
$('#dock').innerHTML=toys.map(function(x,i){return '<div class="toy" style="background:'+x[0]+'" data-i="'+i+'"><svg viewBox="0 0 40 40">'+x[2]+'</svg><span>'+x[1]+'</span></div>'}).join('');
Array.prototype.forEach.call(document.querySelectorAll('.toy'),function(e){e.onclick=function(){boing();toys[e.dataset.i][3]()}});
/* ---------- start ---------- */
fit();requestAnimationFrame(loop);
say('地球を ドラッグして まわそう。 ホイールで ズーム、 国を タッチ！');
})();
